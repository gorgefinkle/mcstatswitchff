# Minecraft 26.2+ Brain is protected on LivingEntity. Expose the single
# complete runtime mind reference to permit atomic whole-Brain exchange.
# Goal selectors are read only: Brain swapping is supported exclusively when
# both mobs have NO goal-selector or targeting goals.
public net.minecraft.world.entity.LivingEntity brain
public net.minecraft.world.entity.Mob goalSelector
public net.minecraft.world.entity.Mob targetSelector
