# Minecraft 26.2+ Brain is protected on LivingEntity. Expose the single
# complete runtime mind reference to permit atomic whole-Brain exchange.
# Goal selectors are read only: Brain swapping is supported exclusively when
# both mobs have NO goal-selector or targeting goals.
public net.minecraft.world.entity.LivingEntity brain
public net.minecraft.world.entity.Mob goalSelector
public net.minecraft.world.entity.Mob targetSelector

# Preserve native WrappedGoal running state and GoalSelector arbitration locks.
public net.minecraft.world.entity.ai.goal.GoalSelector lockedFlags
public net.minecraft.world.entity.ai.goal.GoalSelector disabledFlags
public net.minecraft.world.entity.ai.goal.WrappedGoal isRunning

# Read portable combat-goal intent/configuration before rebuilding it against
# a receiving body's native ranged or melee action contract.
public net.minecraft.world.entity.ai.goal.MeleeAttackGoal speedModifier
public net.minecraft.world.entity.ai.goal.MeleeAttackGoal followingTargetEvenIfNotSeen
public net.minecraft.world.entity.ai.goal.RangedBowAttackGoal speedModifier
public net.minecraft.world.entity.ai.goal.RangedBowAttackGoal attackIntervalMin
public net.minecraft.world.entity.ai.goal.RangedBowAttackGoal attackRadiusSqr

# Rebuild Zombie's species-bound turtle-egg goal as a recipient-owned
# RemoveBlockGoal while retaining its target block, range and reach distance.
public net.minecraft.world.entity.ai.goal.RemoveBlockGoal blockToRemove
public net.minecraft.world.entity.ai.goal.MoveToBlockGoal verticalSearchRange

# Rebuild the base AvoidEntityGoal with the receiving mob's navigation and
# predicates, preserving its original target class, range and travel speeds.
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal avoidClass
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal avoidPredicate
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal maxDist
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal predicateOnAvoidEntity
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal walkSpeedModifier
public net.minecraft.world.entity.ai.goal.AvoidEntityGoal sprintSpeedModifier

# Preserve vanilla village-traversal routing configuration while replacing
# the donor's body-bound canBreakDoors method reference with a recipient query.
public net.minecraft.world.entity.ai.goal.MoveThroughVillageGoal speedModifier
public net.minecraft.world.entity.ai.goal.MoveThroughVillageGoal onlyAtNight
public net.minecraft.world.entity.ai.goal.MoveThroughVillageGoal distanceToPoi

# Preserve base nearest-attackable target selection while rebuilding
# TargetingConditions for the receiving Mob and retaining any safe selector.
public net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal targetType
public net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal randomInterval
public net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal targetConditions
public net.minecraft.world.entity.ai.goal.target.TargetGoal mustSee
public net.minecraft.world.entity.ai.goal.target.TargetGoal mustReach
public net.minecraft.world.entity.ai.goal.target.TargetGoal unseenMemoryTicks
public net.minecraft.world.entity.ai.targeting.TargetingConditions selector
