name: Freaky Friday builds
on:
  push:
    branches: [main, 'feature/whole-mind-swap', 'feature/body-mind-separation', 'feature/native-mind-host-poc', 'feature/dual-instance-host-poc', 'feature/p09-universal-native-ai-host']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A source edit on a draft PR supersedes its older CI run. Avoid
# burning private-repository Actions allowance on obsolete nine-job runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Pure Java core and version profile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate full source presence
        shell: bash
        run: |
          test -f build.gradle
          test -f src/main/java/dev/freakyfriday/AttributeCategorySwapper.java
          test -f src/test/java/dev/freakyfriday/core/CategoryExchangeSelfTest.java
          test -f src/platform/minecraft-26.2/java/dev/freakyfriday/compat/PlatformHooks.java
          test -f src/platform/minecraft-26.3/java/dev/freakyfriday/compat/PlatformHooks.java
      - name: Pure Java regression suite
        run: sh scripts/test-core.sh
      - name: Independent detached-host lifecycle and fault-injection regression
        run: python3 scripts/test-detached-probe-lifecycle.py
      - name: Version isolation and metadata
        run: python3 scripts/test-version-profiles.py
      - name: Validate compressed GameTest structure NBT and arena bounds
        run: python3 scripts/test-structure-templates.py
      - name: R0.11 extended source and synthetic Minecraft audit
        run: python3 scripts/self_audit.py

  gametest:
    name: Real NeoForge GameTest Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run real server GameTests including Ender Dragon and Chicken
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew clean runGameTestServer -PtargetMinecraft=${{ matrix.minecraft }} --no-daemon --stacktrace 2>&1 | tee gametest.log
          grep -Fq 'FF-GAMETEST detached_cross_species PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction zombie_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction cow_to_zombie PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction villager_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction creeper_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction cow_to_creeper PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction zombie_to_villager PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction ender_dragon_to_chicken PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_host_construction chicken_to_ender_dragon PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_dragon_chicken PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST diagnostic_pair ender_dragon chicken PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST diagnostic_pair chicken ender_dragon PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST invalid_type PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST suite PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST cancel PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST all PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST full_workflow PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST mirror40_completion PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST cancel_reselect PASS' gametest.log
          grep -Fq 'FF-WORLDTEST moving_body_collision PASS' gametest.log
          grep -Fq 'FF-WORLDTEST 40tick_cleanup PASS' gametest.log
          grep -Fq 'FF-WORLDTEST original_entities_and_blocks PASS' gametest.log
          grep -Fq 'FF-WORLDTEST all PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY partial_native_swap_fails_closed PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY villager_zombie_brain_swap PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY native_body_speed PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY solid_wall_collision PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_player_reciprocal_movement PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_player_reciprocal_attack PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_player_cancel_restores_both PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY mob_mob_reciprocal_attack PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY native_fall_profiles PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY native_goal_mind_exchange PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY zombie_chicken_behavior_acceptance PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY occupied_mob_death_returns_player PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_death_ejects_both PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY occupied_ocelot_attack_health PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY occupied_ocelot_attack_death_returns PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY mob_origin_attack_original_body PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY invalid_entity_attack_guard PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_mob_reciprocal_gate PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_mob_native_mind_proxy PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_mob_reciprocal_attack PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY stale_selection_and_reciprocal_gate PASS' gametest.log
          grep -Fq 'FF-GAMEPLAY player_body_action_port PASS' gametest.log
          grep -Fq 'FF-NATIVE-PROBE inventory PASS' gametest.log
          grep -Fq 'FF-NATIVE-PROBE world_effect_escape DETECTED' gametest.log
          grep -Fq 'FF-NATIVE-PROBE world_effect_escape PASS' gametest.log
          grep -Fq 'FF-NATIVE-PROBE goal_scheduler PASS' gametest.log
          grep -Fq 'FF-PLAYER-COMMAND all PASS' gametest.log
          grep -Fq 'FF-PLAYER-COMMAND selector_no_double_dispatch PASS' gametest.log
          grep -Fq 'FF-PLAYER-COMMAND permission_and_feedback_origin PASS' gametest.log
          grep -Fq 'FF-PLAYER-COMMAND console_not_redirected PASS' gametest.log
          grep -Fq 'FF-PLAYER-COMMAND cleanup PASS' gametest.log
          grep -Fq 'FF-ISOLATION data_only_exchange PASS' gametest.log
          grep -Fq 'FF-ISOLATION authenticated_wire_tamper_rejected PASS' gametest.log
      - name: Upload GameTest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-gametest
          retention-days: 30
          path: |
            gametest.log
            run/logs/**
            run/reports/**

  dedicated:
    name: Normal dedicated-server smoke Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Boot ordinary headless NeoForge dedicated server and observe 100 ticks
        shell: bash
        run: python3 scripts/test-dedicated-server.py --minecraft ${{ matrix.minecraft }}
      - name: Upload dedicated-server output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-dedicated
          retention-days: 30
          if-no-files-found: warn
          path: |
            dedicated-server.log
            run/logs/**
            run/crash-reports/**

  native-worker-e2e:
    if: false
    name: Two-process bounded native intent capture Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Capture bounded native navigation/attack intents in an independent NeoForge server
        shell: bash
        run: python3 scripts/test-native-worker-e2e.py --minecraft ${{ matrix.minecraft }}
      - name: Upload isolated worker/receiver diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-native-worker-e2e
          retention-days: 30
          if-no-files-found: warn
          path: |
            native-worker-*.log
            run-ai-worker/logs/**
            run/logs/**
            run/crash-reports/**

  supervisor:
    if: false
    name: Live reciprocal worker supervisor Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run real server reciprocal supervisor tests
        run: python3 scripts/test-native-worker-supervisor.py --minecraft ${{ matrix.minecraft }}
      - name: Upload live supervisor and worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-supervisor
          retention-days: 30
          if-no-files-found: warn
          path: |
            supervisor-smoke.log
            run-supervisor-smoke/logs/**
            run-supervisor-smoke/crash-reports/**
            run-supervisor-smoke/freakyfriday-workers/session-*/worker.log
            run-supervisor-smoke/freakyfriday-workers/worker-debug-*.log

  build:
    name: NeoForge Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile and package version-specific mod
        run: bash ./gradlew clean build -PtargetMinecraft=${{ matrix.minecraft }} --no-daemon --stacktrace
      - name: Verify JAR integrity and create SHA256 manifest
        run: python3 scripts/verify-build-artifact.py --minecraft ${{ matrix.minecraft }}
      - name: Package a complete versioned source and exactly one current JAR
        run: python3 scripts/package-full.py --minecraft ${{ matrix.minecraft }}
      - name: Upload JARs and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-build
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
            build/packages/*.zip
