name: NeoForge build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    name: Source audit (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete source import
        shell: bash
        run: |
          test -f build.gradle || { echo "::error::R0.11 full source has not been imported yet"; exit 1; }
          test -f gradlew
          test -f scripts/self_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Source regression harness
        run: python3 scripts/self_audit.py
  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: source-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile and package
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build -PtargetMinecraft=${{ matrix.minecraft }} --no-daemon --stacktrace
      - name: Upload compiled JARs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-build
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
