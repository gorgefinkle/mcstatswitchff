name: Freaky Friday builds
on:
  push:
    branches: [main, 'feature/whole-mind-swap', 'feature/body-mind-separation', 'feature/native-mind-host-poc', 'feature/dual-instance-host-poc']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Pure Java core and version profile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate full source presence
        shell: bash
        run: |
          test -f build.gradle
          test -f src/main/java/dev/freakyfriday/AttributeCategorySwapper.java
          test -f src/test/java/dev/freakyfriday/core/CategoryExchangeSelfTest.java
          test -f src/platform/minecraft-26.2/java/dev/freakyfriday/compat/PlatformHooks.java
          test -f src/platform/minecraft-26.3/java/dev/freakyfriday/compat/PlatformHooks.java
      - name: Pure Java regression suite
        run: sh scripts/test-core.sh
      - name: Independent detached-host lifecycle and fault-injection regression
        run: python3 scripts/test-detached-probe-lifecycle.py
      - name: Version isolation and metadata
        run: python3 scripts/test-version-profiles.py
      - name: R0.11 extended source and synthetic Minecraft audit
        run: python3 scripts/self_audit.py

  gametest:
    name: Real NeoForge GameTest Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run real server GameTests including Ender Dragon and Chicken
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew runGameTestServer -PtargetMinecraft=${{ matrix.minecraft }} --no-daemon --stacktrace 2>&1 | tee gametest.log
          grep -Fq 'FF-GAMETEST detached_cross_species PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair zombie_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair cow_to_zombie PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair villager_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair creeper_to_cow PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair cow_to_creeper PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair zombie_to_villager PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair ender_dragon_to_chicken PASS' gametest.log
          grep -Fq 'FF-GAMETEST pair chicken_to_ender_dragon PASS' gametest.log
          grep -Fq 'FF-GAMETEST detached_dragon_chicken PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST pair ender_dragon chicken PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST pair chicken ender_dragon PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST invalid_type PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST suite PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST cancel PASS' gametest.log
          grep -Fq 'FF-COMMANDTEST all PASS' gametest.log
      - name: Upload GameTest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-gametest
          retention-days: 30
          path: |
            gametest.log
            run/logs/**
            run/reports/**

  build:
    name: NeoForge Minecraft ${{ matrix.minecraft }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile and package version-specific mod
        run: bash ./gradlew build -PtargetMinecraft=${{ matrix.minecraft }} --no-daemon --stacktrace
      - name: Verify JAR integrity and create SHA256 manifest
        run: python3 scripts/verify-build-artifact.py --minecraft ${{ matrix.minecraft }}
      - name: Upload JARs and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freakyfriday-mc${{ matrix.minecraft }}-build
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
