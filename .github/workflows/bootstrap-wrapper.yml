name: Bootstrap Gradle wrapper
on:
  push:
    paths:
      - .github/workflows/bootstrap-wrapper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Generate wrapper from independent minimal Gradle project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf "rootProject.name='wrapper-generator'\n" > settings.gradle
          printf "plugins { id 'java' }\n" > build.gradle
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin --no-daemon
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/gradle/wrapper/"
      - name: Commit wrapper binaries (no cache)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          git add -f gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then echo 'Wrapper already current'; exit 0; fi
          git commit -m "Bootstrap Gradle 9.2.1 wrapper for Java 25"
          git push origin HEAD:main
