import java.util.Properties

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The project is intentionally pinned to Minecraft 26.2 until universal
// mind exchange is complete and passes its live acceptance suite.
// Later-version source/profile files may remain as dormant porting references,
// but are not compiled, packaged, or tested by this build.
def selectedMinecraft = '26.2'
def requestedMinecraft = providers.gradleProperty('targetMinecraft').orNull
if (requestedMinecraft != null && requestedMinecraft != selectedMinecraft) {
    throw new GradleException(
        "Freaky Friday development is currently pinned to Minecraft 26.2; " +
        "requested targetMinecraft=" + requestedMinecraft + " is deferred."
    )
}
def selectedProfile = file('versions/minecraft-26.2.properties')
if (!selectedProfile.isFile()) {
    throw new GradleException('Missing Minecraft 26.2 version profile')
}
def profile = new Properties()
selectedProfile.withInputStream { profile.load(it) }
if (profile.getProperty('minecraft_version') != selectedMinecraft) {
    throw new GradleException('Selected version does not match the 26.2 profile metadata')
}

group = 'dev.freakyfriday'
version = '0.13.2-alpha'
base { archivesName = 'freakyfriday-mc26.2-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Only the 26.2 platform integration is part of this build.
sourceSets.main.java.srcDir('src/platform/minecraft-26.2/java')

neoForge {
    version = profile.getProperty('neo_version')
    validateAccessTransformers = true
    runs {
        client { client() }
        server { server(); gameDirectory = project.file('runs/server'); programArgument '--nogui' }
    }
    mods { freakyfriday { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property 'freakyFridayMcVersion', selectedMinecraft
    inputs.property 'freakyFridayNeoVersion', profile.getProperty('neo_version')
    inputs.property 'freakyFridayModVersion', project.version.toString()
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            ff_mc_version: selectedMinecraft,
            ff_neo_version: profile.getProperty('neo_version'),
            ff_mod_version: project.version.toString()
        )
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('showTarget') {
    group = 'verification'
    doLast {
        println "FreakyFriday " + version + " targets Minecraft " + selectedMinecraft +
            " / NeoForge " + profile.getProperty('neo_version')
    }
}

// The R0.11 regression sources are self-executing main classes, not JUnit tests.
// Execute all assertions under check so a successful build runs the regression suite.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
def coreChecks = ['CategoryExchangeSelfTest', 'CategoryDefinitionsSelfTest', 'CategorySchemaSelfTest', 'CategoryOffersSelfTest']
coreChecks.each { checkName ->
    tasks.register("run${checkName}", JavaExec) {
        group = 'verification'
        description = "Run " + checkName + " executable assertions"
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "dev.freakyfriday.core." + checkName
        enableAssertions = true
    }
}
tasks.named('check') {
    dependsOn(coreChecks.collect { tasks.named("run" + it) })
}

tasks.register("runMindLedgerSelfTest", JavaExec) {
    group = 'verification'
    description = "Verify whole-mind ownership exchange across all three pairing modes"
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.freakyfriday.mind.MindLedgerSelfTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn tasks.named('runMindLedgerSelfTest') }

tasks.register("runDynamicObjectGraphSelfTest", JavaExec) {
    group = 'verification'
    description = "Diagnostic only: exercise reflective object-graph capture against synthetic fixtures"
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.freakyfriday.mind.DynamicObjectGraphSelfTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn tasks.named('runDynamicObjectGraphSelfTest') }

tasks.register("runMindBodyBindingsSelfTest", JavaExec) {
    group = 'verification'
    description = "Verify species-agnostic controller-to-body ownership and exact reversal"
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.freakyfriday.mind.MindBodyBindingsSelfTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn tasks.named('runMindBodyBindingsSelfTest') }

tasks.register("runMindBodyContextSelfTest", JavaExec) {
    group = 'verification'
    description = "Verify nested, exception-safe controller to physical body context"
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.freakyfriday.mind.MindBodyContextSelfTest'
    enableAssertions = true
}
tasks.named('check') { dependsOn tasks.named('runMindBodyContextSelfTest') }
